name: EEB Daily and lab website

# ChatGPT Pro does the research in its cloud scheduled task and writes only an
# inbox JSON file through the connected GitHub app. These jobs use no AI API.
# Once Pages is configured for GitHub Actions, ALL master pushes must deploy so
# ordinary changes elsewhere on the lab website continue to be published.
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 6,23 * * *"
      timezone: America/Chicago

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
      latest_no: ${{ steps.snapshot.outputs.latest_no }}
      latest_date: ${{ steps.snapshot.outputs.latest_date }}
      accept_outcome: ${{ steps.accept.outcome }}
    steps:
      - name: Check out the latest website revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test record validation and publishing
        run: python3 -m unittest discover -s eeb-daily/tools/tests -p 'test_*.py'

      - name: Validate the whole inbox, then accept records
        id: accept
        continue-on-error: true
        run: python3 eeb-daily/tools/publish.py > "$RUNNER_TEMP/eeb-publish.json"

      - name: Retain canonical issues after a rejected inbox
        if: steps.accept.outcome == 'failure'
        run: |
          # This is a fresh Actions checkout. Restore all tracked newsletter
          # files and remove only untracked transaction products, even if the
          # acceptance process stopped unexpectedly midway through its writes.
          git restore --source=HEAD --worktree -- eeb-daily
          git clean -fd -- eeb-daily/data eeb-daily/inbox
          echo "::warning::The newsletter inbox was rejected. Deploying the last canonical issue and other website changes."

      - name: Rebuild the newsletter and archive
        run: python3 eeb-daily/tools/build.py > "$RUNNER_TEMP/eeb-build.json"

      - name: Save accepted issues and generated pages
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git fetch --no-tags origin master
          if [ "$base" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::master changed during the build; a subsequent run will use its latest contents."
            exit 1
          fi
          git add -- eeb-daily
          if ! git diff --cached --quiet; then
            git config user.name "EEB Daily"
            git config user.email "coleoguy@gmail.com"
            git commit -m "[agent] Publish validated EEB Daily records"
            # No force push or automatic rebase: a concurrent writer causes a
            # safe failure and leaves the inbox for the next recovery run.
            git push origin HEAD:master
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'eeb-build.json')) as f:
              result = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'latest_no={int(result["latest"])}\n')
              f.write(f'latest_date={result["latest_date"]}\n')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Record the exact deployed snapshot
        env:
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_sha }}
          LATEST_NO: ${{ steps.snapshot.outputs.latest_no }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          # Create this CI-only source file after the commit step. Jekyll copies
          # it into the artifact; its container-owned _site is not writable here.
          marker = Path('eeb-daily/deployment.json')
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(json.dumps({
              'source_sha': os.environ['SOURCE_SHA'],
              'latest_no': int(os.environ['LATEST_NO']),
          }) + '\n', encoding='utf-8')
          PY

      - name: Build the entire lab website with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the complete site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy an obsolete repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "::error::master changed after the build; refusing to deploy an obsolete snapshot."
            exit 1
          fi

      - name: Deploy GitHub Pages explicitly
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify the public newsletter contains this deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          LATEST_NO: ${{ needs.build.outputs.latest_no }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/')
          sha = os.environ['SOURCE_SHA']
          latest = int(os.environ['LATEST_NO'])
          error = 'deployment marker not yet visible'
          for attempt in range(12):
              try:
                  url = f'{base}/eeb-daily/deployment.json?revision={sha}'
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      marker = json.load(response)
                  with urllib.request.urlopen(f'{base}/eeb-daily/?revision={sha}', timeout=20) as response:
                      page = response.read().decode('utf-8')
                  if marker.get('source_sha') == sha and marker.get('latest_no') == latest and f'Vol. 1, No. {latest}</span>' in page:
                      print(f'Public website verified: EEB Daily No. {latest}, revision {sha}')
                      break
                  error = 'public content does not yet match the deployed snapshot'
              except Exception as exc:
                  error = str(exc)
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit('Live verification failed: ' + error)
          PY

      - name: Check that the scheduled issue arrived
        if: github.event_name == 'schedule' && needs.build.outputs.accept_outcome != 'failure'
        env:
          LATEST_DATE: ${{ needs.build.outputs.latest_date }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Chicago'))
          # Morning recovery expects today's issue; late evening expects the
          # next morning's issue. A delayed recovery uses its actual local date.
          expected = now.date() + timedelta(days=int(now.hour >= 18))
          actual = datetime.strptime(os.environ['LATEST_DATE'], '%Y-%m-%d').date()
          if actual < expected:
              raise SystemExit(f'EEB Daily is stale: latest issue {actual}, expected {expected}. '
                               'The last valid issue remains online. Check the ChatGPT cloud task.')
          print(f'Issue freshness verified: {actual}')
          PY

      - name: Report rejected newsletter input after website deployment
        if: always() && needs.build.outputs.accept_outcome == 'failure'
        run: |
          echo "::error::EEB Daily input was rejected. The last canonical issue was retained; unrelated website changes were allowed to deploy. Review the Validate the whole inbox step, then correct the inbox record."
          exit 1
