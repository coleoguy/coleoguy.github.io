title: Blackmon Lab
description: The Blackmon Lab studies genome structure evolution across the tree of life using computational, comparative, and experimental approaches at Texas A&M University.
url: https://coleoguy.github.io
baseurl: ""

# Default OpenGraph image and other metadata used by _includes/head.html
og_image: https://coleoguy.github.io/assets/img/slide-beetle.jpg
ga_id: G-4J0HZ3LNQX

# Jekyll: pages without front-matter are passed through unchanged.
# We `include` files that start with `.` or `_` so they get served (they would otherwise be hidden from the build).
# We `exclude` only things that are clearly NOT meant to be served.
# IMPORTANT: do NOT exclude `data/`, `subpages/`, `*.pdf`, `*.csv`, etc., those are
# actively fetched/linked by the site. The earlier broad exclusion broke the news feed,
# the karyotype + tau databases, and several download links.
include:
  - llms.txt
  - llms-full.txt
  - robots.txt
  - sitemap.xml

exclude:
  - README.md
  - "deprecated/"
  - "metazoa-patches/"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor/"
  - "node_modules/"
  - "_includes/MIGRATION.md"
  - "*.Rhistory"
  - ".Rapp.history"
  - ".RData"
  - "wiki_tools/"
  - "AGENT_CONTRACT.md"
  - "drafts/"

# Use the default empty Jekyll plugins so this works on GitHub Pages without a Gemfile.
plugins: []
